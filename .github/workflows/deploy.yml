name: Build and Deploy salistar.com

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      # Le middleware protege /dashboard : hors de `app/`, il serait sinon
      # modifie sans jamais declencher de deploiement.
      - 'middleware.ts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "lower=${IMAGE_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Serveur 3 = Oracle ARM64 (aarch64) -> build multi-arch
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lower }}/salistar-portfolio:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lower }}/salistar-portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # ----- salistar.com -----
            cd ~/apps/salistar
            git fetch --all && git reset --hard origin/main

            # Variables du tableau de bord et de la reception des messages.
            # Ecrites ICI a partir des secrets GitHub plutot que posees a la
            # main sur le serveur : un `.env` cree manuellement se perd au
            # premier reprovisionnement, et personne ne se souvient de ce qu il
            # contenait. Le fichier est reecrit a chaque deploiement, donc
            # GitHub reste la source de verite.
            umask 077
            cat > .env <<'ENVFILE'
            DASHBOARD_PASSWORD_HASH=${{ secrets.DASHBOARD_PASSWORD_HASH }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            MAIL_INGEST_KEY=${{ secrets.MAIL_INGEST_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            NOTIFY_EMAIL=${{ secrets.NOTIFY_EMAIL }}
            NOTIFY_FROM=${{ secrets.NOTIFY_FROM }}
            ENVFILE
            chmod 600 .env

            docker compose pull
            docker compose up -d --remove-orphans
            # ----- salorie.salistar.com (meme serveur dedie) -----
            cd ~/apps/salorie-landing
            git fetch --all && git reset --hard origin/main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af --filter "until=72h"
            sleep 5
            echo "--- salistar ---"; (cd ~/apps/salistar && docker compose ps)
            echo "--- salorie ---"; (cd ~/apps/salorie-landing && docker compose ps)

  cloudflare-purge:
    name: Purge Cloudflare cache
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      # Le site est DEJA deploye et verifie quand ce job tourne : un cache non
      # purge se resorbe tout seul en quelques minutes. Faire echouer le
      # workflow entier pour ca revenait a laisser un rouge permanent — et un
      # workflow toujours rouge est un workflow que plus personne ne regarde,
      # y compris le jour ou c'est le deploiement qui casse.
      #
      # On n'ETOUFFE pas l'erreur pour autant : le corps de la reponse
      # Cloudflare est affiche, avec la marche a suivre. Visible sans etre bloquant.
      - name: Purge cache
        continue-on-error: true
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_ZONE_ID ou CF_API_TOKEN absent — purge ignoree."
            exit 0
          fi

          reponse=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          code=$(echo "$reponse" | tail -1)
          corps=$(echo "$reponse" | sed '$d')

          if [ "$code" = "200" ]; then
            echo "Cache purge."
            exit 0
          fi

          echo "::warning::Purge refusee par Cloudflare (HTTP $code). Le deploiement, lui, a reussi."
          echo "Reponse : $corps"
          echo ""
          echo "En HTTP 401/403, le jeton CF_API_TOKEN (cree le 17/05/2026) est"
          echo "expire, revoque, ou sans la permission « Cache Purge » sur cette"
          echo "zone. Le regenerer dans Cloudflare > My Profile > API Tokens,"
          echo "puis : gh secret set CF_API_TOKEN --repo salistar/salistar"
          exit 1

  health-check:
    name: Verify deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: sleep 30
      - run: curl -fsS -I https://salistar.com || echo "Site not yet reachable"
